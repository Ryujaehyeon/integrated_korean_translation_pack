 eos_evergleam_shard_create:0 "프리즘 회상"
 eos_evergleam_shard_create_desc:0 "지도자가 지휘하는 함대가 §H$pc_black_hole$§!의 궤도에 진입하면 §Y$EOS_EVERGLEAM_WORMHOLE$ 네트워크§!에 추가됩니다$TABBED_NEW_LINE$- §Y$EOS_EVERGLEAM_WORMHOLE$§! 조각 하나하나가 §Y$EOS_EVERGLEAM_WORMHOLE$§! 결절의 매장지를 향상시킵니다"
 eos_evergleam_shard_create_req_leader:0 "함대에 지도자가 있어야 합니다"
 elven_anorim_origin_events.20100.name:0 "$eos_evergleam_shard_create$"
 elven_anorim_origin_events.20100.desc:0 "§Y[this.GetName]§!이(가) §H[solar_system.GetName]§! 성계에 새로운 §G$EOS_EVERGLEAM_WORMHOLE$§!을(를) 형성했습니다.\n\n§H[from.GetName]§!의 빛은 오래전에 사라졌지만, 우리의 기억 속에서 영원히 빛날 것입니다."
 elven_anorim_origin_events.20100.a:0 "공간은 좁아지고, 영겁은 찰나가 되어라."
