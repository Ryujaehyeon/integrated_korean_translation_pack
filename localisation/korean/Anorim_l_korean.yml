 eos_evergloom_empire_escort:0 "신벨"
 START_SCREEN_PRISMATIC_REFUGE:0 "'여정에 나선 모든 이가 마지막 항구를 맞이하지는 못하리라.\n마지막 항구에 닿은 모든 이가 여정의 끝을 보지는 못하리라.'\n\n대대로 이 말들은 약속이자 경고로 세대에서 세대로 전해졌고, 사람들은 §H$ELVEN_drow1_arkship_name$§!이(가) 마침내 프리즘 같은 광휘에 잠긴 세계의 표면에 내려앉아 다가오는 어둠을 두려워하며 별에서 별로 표류하는 일이 다시는 없을 날을 꿈꾸었습니다.\n\n약속은 이루어졌으나 경고를 잊어서는 안 됩니다. 우리는 여전히 필멸이며, 우리를 그렇게 만든 $eos_galtaereth_she_color$는 우리를 감싸 주는 $eos_anoriel_she_color$가 더는 그럴 수 없게 될 때 우리를 거두어 갈 것입니다.\n\n이 여정은 다른 이의 뜻대로 끝나서는 안 됩니다."
 START_SCREEN_PRISMATIC_REFUGE_NOMAD:0 "'여정에 나선 모든 이가 마지막 항구를 맞이하지는 못하리라.\n마지막 항구에 닿은 모든 이가 여정의 끝을 보지는 못하리라.'\n\n대대로 이 말들은 약속이자 경고로 세대에서 세대로 전해졌고, 사람들은 §H[Capital.GetName]§!이(가) 프리즘 같은 광휘의 등대 아래, 다가오는 어둠이 뚫을 수 없는 유령 같은 망토 속에 숨을 수 있는 날을 꿈꾸었습니다.\n\n약속은 이루어졌으나 경고를 잊어서는 안 됩니다. 우리는 여전히 필멸이며, 우리를 그렇게 만든 $eos_galtaereth_she_color$는 우리를 감싸 주는 $eos_anoriel_she_color$가 더는 그럴 수 없게 될 때 우리를 거두어 갈 것입니다.\n\n이 여정은 다른 이의 뜻대로 끝나서는 안 됩니다."
 elven_anorim_prismatic_refuge_chain_title:0 "산산이 부서진 유리를 지나서"
 elven_anorim_prismatic_refuge_chain_desc:0 "'여정에 나선 모든 이가 마지막 항구를 맞이하지는 못하리라.\n마지막 항구에 닿은 모든 이가 여정의 끝을 보지는 못하리라.'\n\n우리는 힘과 오만 위에 세워졌다가 바로 그것들로 파멸한 고대 제국의 유일한 잔존자입니다.\n수천 년 동안 우리는 별과 별 사이의 공허를 표류하며, 우리 조상들이 한때 그 신성을 찬탈하려 했던 $eos_galtaereth_her_color$, 곧 $eos_galtaereth_alias_color$에게 쫓겼습니다.\n그러나 마침내 우리는 약속된 피난처, 우리를 인도하는 $eos_anoriel_her_color$, 곧 $eos_anoriel_alias_color$가 축복한 별에 닿았습니다. 우리가 쉬고, 회복하고, 재건할 곳이 바로 여기입니다. 그리고 때가 오면, 이제는 충분히 속죄하고도 남은 고대의 죄의 사슬을 끊고 나아갈 것입니다."
 elven_anorim_prismatic_refuge_survive_poi:0 "암흑의 십일조에서 살아남기"
 elven_anorim_prismatic_refuge_survive_poi_desc:0 "$eos_galtaereth_color$의 포식은 우리가 감지하는 법을 익힌 조류처럼 밀려옵니다. $eos_galtaereth_her_color$의 존재가 드리우는 숨 막히는 그림자가 임박하면, 우리 백성이 $eos_anoriel_color$의 프리즘 요람 속에서 피난처를 찾게 하십시오."
 elven_anorim_prismatic_refuge_wormhole_poi:0 "$EOS_EVERGLEAM_WORMHOLE$ 네트워크 접속"
 elven_anorim_prismatic_refuge_wormhole_poi_desc:0 "회상의 거울 속에서 시간과 공간은 기억을 중심으로 휘어지고, 셋이 하나로 수렴합니다. 우리가 걸어온 길을 떠올릴 때 목적지 사이의 광년은 사라집니다."
 EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION:0 "사이오닉 전통 숙달"
 EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION_DESC:0 "$eos_galtaereth_she_color$가 머무는 장막을 감히 들여다본 지 수 세기가 흘렀지만, $eos_galtaereth_her_color$에게 맞설 희망이 조금이라도 있다면 우리는 비전의 지식으로 다시 무장할 수밖에 없습니다."
 EOS_ANORIM_PSIONIC_TRADITIONS_FINISHED:0 "모든 사이오닉 전통 보유"
 EOS_ANORIM_PRISMATIC_REFUGE_EXPLORE_EVERGLOOM:0 "$eos_nebula_evergloom$ 성계 탐사"
 EOS_ANORIM_PRISMATIC_REFUGE_EXPLORE_EVERGLOOM_DESC:0 "고대의 기술을 되찾은 우리는 유배의 경로를 되짚어 §H$eos_nebula_evergloom$§!을(를) 다시 찾아낼 수 있었습니다. 그러나 우리가 돌아가는 곳은 고향이 아닙니다. 결코 아닙니다. 이 지점 너머는 $eos_galtaereth_her_color$의 영역이며, 그곳에는 오직 악몽만이 머물고 있습니다.\n\n그럼에도 악몽을 영원히 끝내려면 우리는 그곳에 맞서야 합니다."
 EOS_ANORIM_EVERGLOOM_EXPLORATION:0 "탐사한 성계"
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_02:0 "적대 접촉에 맞서라"
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_02_DESC:0 "성계 내의 적대 세력이 우리 센서를 교란하고 있습니다. 이들을 처리하기 전에는 $eos_nebula_evergloom$ 더 깊은 곳으로 나아갈 수 없습니다."
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_03:0 "스타플레이어를 파괴하라"
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_03_DESC:0 "장막의 혐오스러운 존재가 이 지역의 $eos_evergloom_ripples$ 흐름을 교란하고 있습니다. 그것을 몰아내기 전에 뛰어드는 것은 자살 행위입니다."
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_04:0 "발샤렌 키오를을 묻어라"
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_04_DESC:0 "근위대 식별 신호를 단 함선들이 통신을 송신하는 것으로 보이지만, 선내에서는 생명 신호가 감지되지 않습니다..."
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_05:0 "거미줄을 걷어 내라"
 EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_05_DESC:0 "오래전 떠난 이들의 죄가 더는 아직 살아 있는 이들을 얽매지 않게 하라."
 EOS_ANORIM_CLEAR_SYSTEM:0 "성계 확보"
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_RIPPLES_PROJECT:0 "아공간 항법 조율"
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_RIPPLES_PROJECT_DESC:0 "$eos_nebula_evergloom$을(를) 항해하는 데 하이퍼드라이브만으로는 부족합니다. 장막에 잠긴 위험한 성운을 가로지르려면 그 해류를 관찰하고 순풍이 불 때를 기다려야 합니다."
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_04_GATE_PROJECT:0 "회상을 완성하라"
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_04_GATE_PROJECT_DESC:0 "이곳에서 출발한 이들 중 우리 곁에 남은 이는 없지만, 그들의 기억은 계속 살아 있습니다. 그들은 닿기에는 너무 먼 미래를 꿈꾸었고, 더는 꿈꿀 수 없게 되었을 때 그 꿈은 우리에게 넘어왔습니다.\n\n그들이 갈망한 내일을 이제 우리가 붙잡으면서, 그들의 과거는 우리의 것이 되고 우리의 미래는 그들의 것이 되며 우리의 꿈은 마침내 하나가 됩니다."
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_TEAR_PROJECT:0 "악몽을 끝내라"
 EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_TEAR_PROJECT_DESC:0 "한 번 부서진 것은 결코 원래의 온전한 모습으로 돌아오지 않습니다. 그러나 그 형태는 여전히 이어 붙일 수 있습니다. 모든 회한이 잠들게 하고, 이 파멸의 몽상이 끝나게 하소서."
 EOS_LEADER_REQUIREMENT:0 "지도자가 지휘하는 함대 $COUNT$/$REQUIRED$개가 궤도에 있습니다."
 EOS_NO_HOSTILES_REQUIREMENT:0 "임박한 위험이 없습니다."
 elven_anorim_origin_events.101.name:0 "산산이 부서진 유리: 깜박이는 희미한 빛"
 elven_anorim_origin_events.101.desc:0 "우리는 여러 세대 동안 §R모든 것을 삼키는 어둠§! 속을 표류하며 §G먼 반짝임§!을 찾아 헤맸습니다.\n\n그 여정의 시작에서는 우리가 끊임없이 꿈꾼 눈부신 광채가 정말 존재하는지, 하물며 끝없이 뻗은 어두운 지평선 너머 어디에서 언제 발견될지 아는 이는 아무도 없었습니다.\n\n그럼에도 우리는 그림자 속에 도사린 죽음을 너무나 잘 알고 있었습니다. 목적 없어 보이는 수색이 아무리 막막해도, 뒤꿈치를 쫓는 추격자는 훨씬 더 끔찍한 시련이었습니다.\n확실한 파멸이 유일한 대안이었기에, 결국 믿음이 우리가 계속 나아가는 데 필요한 전부가 되었습니다.\n\n이 신화 같은 여정의 시작을 기억하는 산 자는 없지만, 목적지를 잊지 않으려는 우리의 고집이 마침내 보답받았는지도 모릅니다. 많은 이들은 아직 너무 놀라 자신의 눈을 믿지 못하지만... 그들의 마음은 다시 타오른 희망의 불씨를 부정할 수 없습니다.\n우리는 약속의 땅을 찾았고, 그와 함께 믿음에 대한 거대한 시험도 찾았습니다... 다가오는 폭풍이 가까워지는 지금, 우리는 그 자리를 지키며 무엇이 오든 맞서기로 했으니까요.\n\n이곳에서 모든 환상이 산산이 깨지고 진실이 드러날 것입니다. 이것은 그저 §R파멸할 나방 떼를 홀리는 유혹적인 불꽃§!일까, 아니면..."
 elven_anorim_origin_events.101.a:0 "§G...언제든 돌아올 수 있는 안전한 항구일까?§!"
 elven_anorim_origin_events.101.b:0 "§G...앞으로 우리를 길러 줄 오아시스일까?§!"
 elven_anorim_origin_events.102.name:0 "산산이 부서진 유리: 흐려지는 광택"
 elven_anorim_origin_events.102.desc:0 "비명은 잦아들고 정적이 지배합니다...\n\n여느 때처럼 $eos_galtaereth_color$가 $eos_galtaereth_her_color$의 장막에 싸인 영역에서 내려와 비단 같은 거미줄을 칠흑 같은 발톱으로 훑으며 걸려든 먹이를 모조리 거두어 갔습니다...\n\n그러나... 암울한 위안이라 할 만하게도, 이번에는 수확이 갑자기 멈췄습니다. 마치 무언가가 $eos_galtaereth_her_color$의 주의를 흩뜨렸거나, 어쩌면 물리친 것처럼 말입니다.\n\n[anorim_star.GetName]의 즉각적인 보호 밖에 있던 이들 중 많은 수도 상처는 입었으나 대부분 살아남았습니다. 그럼에도... 생존한 [root.GetName]이(가) 맴돌던 정적을 깨며 집단적으로 안도의 한숨을 내쉬자, 우리가 그토록 오래 품어 온 희망의 불씨가 마침내 불꽃으로 타올랐습니다!\n\n$eos_anoriel_color$의 약속은 조상들이 절망을 물리치려 지어낸 잠자리 이야기가 아니었습니다. 우리는 $eos_anoriel_her_color$의 아름다움을 보았고 그 눈부신 광채 속에서 구원을 찾았습니다.\n\n그리고 어쩌면... 그것으로 충분할지도 모릅니다.\n수천 년 동안 운명의 실 한 가닥을 붙잡고 살아온 우리는 이미 바랄 수 있는 모든 구원을 찾았는지도 모릅니다.\n그리고 더 바라는 것은 우리 선조들을 몰락으로 이끈 탐욕과 다를 바 없을지도...\n\n어쩌면... 하지만 이런 물음들은 더 맑은 정신으로 곱씹는 편이 낫습니다. 지금은 우리 백성이 원하는 대로 기뻐하고 애도하도록 두겠습니다."
 elven_anorim_origin_events.102.a:0 "미래는 아직 오지 않았지만, 현재는 기다려 주지 않는다."
 elven_anorim_origin_events.102.b:0 "미래는 아직 오지 않았지만, 현재는 기다려 주지 않는다."
 elven_anorim_origin_events.103.name:0 "산산이 부서진 유리: 흐릿한 반영"
 elven_anorim_origin_events.103.desc:0 "$eos_anoriel_she_color$가 우리에게 말을 걸었습니다.\n\n말이나 환영으로가 아닙니다. $eos_galtaereth_alias_color$의 끊임없이 짓누르는 위협과 달리, $eos_anoriel_alias_color$의 존재는 오직 몽상 속에서만 느낄 수 있는 희미하지만 위안이 되는 온기로 남아 있습니다.\n그럼에도 버려진 조국을 탈출한 이래 처음으로 그 감각이... 이전보다 더 강렬하고 더 깊은 무언가를 표현했습니다.\n\n안타깝게도 우리가 그 꿈의 의미를 해독하지 못하는 것은 수단이 없어서가 아니라... 두려움 때문입니다.\n\n우리에게 전해진 애도의 노래는 한때 자랑스러웠던 우리 종족이 잃어버린 수많은 은총을 한탄합니다. 그중 영생과, 한때 장막을 뜻대로 다루던 수월함은 가장 사무치게 그리운 것입니다. 하나는 $eos_galtaereth_her_color$의 손에 빼앗겼고, 다른 하나는... 우리가 스스로 버렸습니다.\n장막과의 연결을 끊은 덕분에 우리는 $eos_galtaereth_color$의 시선을 피해 그녀의 영역을 빠져나올 만큼 오래 버텼습니다. 그러나 동시에 $eos_anoriel_color$와 교감하는 능력도 잃고 말았습니다...\n\n$eos_anoriel_she_color$가 다시 우리에게 말을 걸지만 우리는 여전히 듣지 못한다는 사실이 $eos_galtaereth_alias_color$의 필멸의 저주보다도 더 고통스럽게 느껴지기 시작합니다.\n스스로에게 묻기에는 불안한 질문이지만 반드시 던져야 합니다. §G온기에 대한 갈망§!은 §R추위에 대한 두려움§!을 이길 수 있을까?"
 elven_anorim_origin_events.103.a:0 "불완전함이 정말로 무(無)보다 나은가?"
 elven_anorim_origin_events.103.b:0 "불완전함이 정말로 무(無)보다 나은가?"
 elven_anorim_origin_events.201.name:0 "산산이 부서진 유리: 스며드는 어둠"
 elven_anorim_origin_events.201.desc:0 "예상대로 우리가 장막으로 가는 길을 되짚기 시작한 뒤로 $eos_galtaereth_alias_color$의 그림자는 우리 영혼에 더 깊고 무겁게 드리웠습니다.\n\n그러나 이번에는 [root.GetSpeciesNamePlural]이(가) 준비 없이, 홀로, 두려움에 떨며 격류 속으로 뛰어들지 않습니다. $eos_anoriel_alias_color$가 우리의 갈망을 감지하고 온기로 응답했습니다. 여러 세대 만에 처음으로 우리는 $eos_anoriel_her_color$의 의도를 짐작할 필요도, $eos_anoriel_her_color$의 행동을 의아해할 필요도, $eos_anoriel_her_color$의 사랑을 의심할 필요도 없습니다.\n\n이제 우리는 이해하기 때문입니다. 이제 우리는 기억하기 때문입니다.\n\n그 기억은 우리가 만든 것이 아니지만 우리의 것이며, 회상의 프리즘을 깊이 들여다보자 진실이 수정처럼 또렷해집니다. §G희망§!은 §R탐욕§!이 아니고, §G사랑§!은 §R굶주림§!이 아니며, §G슬픔§!은 §R공허§!가 아닙니다.\n\n끊임없이 달아나면서도 결코 나아가지 못한 채, 우리는 두려움에 닻을 내린 지 너무 오래되었습니다.\n긴 유배를 거치며 우리는 살아남았습니다. 피난처에 닿아 우리는 재건할 힘을 얻었습니다. 그리고 이제 돌이킬 수 없는 지점을 넘어섰으며, 다음 지평선에 대해서는 의문의 여지가 없습니다. 우리의 자유로 가는 길은 그것을 잃은 곳으로 되돌아갑니다.\n원죄가 잉태된 곳으로.\n신성한 피가 흘려진 곳으로.\n열린 상처가 오늘날까지 곪아 별들 위로 악의를 흘리는 곳으로.\n\n§H$eos_nebula_evergloom$§!."
 elven_anorim_origin_events.201.a:0 "흉터를 감춘다고 그 아래의 상처가 사라지지는 않는다."
 elven_anorim_origin_events.201.b:0 "흉터를 감춘다고 그 아래의 상처가 사라지지는 않는다."
 elven_anorim_origin_events.202.name:0 "산산이 부서진 유리: 깊어지는 반그림자"
 elven_anorim_origin_events.202.desc:0 "[anorim_star.GetName]의 안전한 항구에 닿기까지 우리는 수 세기가 걸렸습니다. 뒤틀린 굴곡과 고된 시련, 그리고 우리를 몇 번이고 멸종의 문턱으로 몰아넣은 수많은 위험으로 이루어진 길이었습니다.\n\n그 여정의 모든 걸음은 길 잃은 방랑자들의 여러 세대가 세심하게 관리한 우리 고대 방주선의 데이터뱅크에 기록되어 있습니다.\n그러나 수천 년에 걸친 그 경로를 되짚는 것은 우리가 출발점으로 돌아가는 방법이 아닙니다.\n좌표와 성도 외에도 [root.GetName]의 유배길은 이야기로 전해지고, 노래로 실려 오고, 화면 위에서 춤추고, 캔버스에 새겨져 살아 있습니다. 필멸의 운명에 맞선 투쟁을 완벽하게 환기하는 것들입니다.\n\n$eos_anoriel_color$의 인도 아래 우리는 프리즘을 들여다보고... 한 번도 본 적 없는 모든 것을 기억할 것입니다. 그리고 기억하면서, 그것을 처음으로 보게 될 것입니다."
 elven_anorim_origin_events.202.a:0 "기억 속에서는 세월도 광년도 아무 의미가 없다."
 elven_anorim_origin_events.202.b:0 "기억 속에서는 세월도 광년도 아무 의미가 없다."
 elven_anorim_origin_events.203.name:0 "산산이 부서진 유리: 다가오는 그늘"
 elven_anorim_origin_events.203.desc:0 "[eos_evergloom_exploration_ship.GetName]의 승무원들이 에버글림 프리즘의 몽상에서 깨어나자, 그들을 맞이한 것은 위안이 스며든 황량함이었습니다. 우리의 회고를 이곳에서 시작하는 것은 아마 필연이었을 것입니다.\n\n시인들은 이 항성을 전설 속에 §H[anorim_evergloom_cluster_01.GetName]§!이라는 이름으로 두드러지게 새겨 두었습니다. 전승에 따르면 이곳은 조상들이 $eos_galtaereth_alias_color$의 시선을 아주 잠시나마 피하려는 필사적인 도박으로 장막과의 연결을 끊은 곳입니다. 고통스러울 만큼 짧은 순간이었지만 $eos_galtaereth_her_color$의 고치를 깨고 나올 만큼은 길었습니다.\n그렇게 끝이 보이지 않는 끝없는 공허 속에서 그들의 위대한 항해가 시작되었습니다.\n\n직접 눈으로 보니 이곳을 먼저 거쳐 간 이들과 나누고 싶은 향수가 밀려오지만, §H$eos_nebula_evergloom$§!은(는) 마음 편히 구경할 곳이 아님을 잊어서는 안 됩니다. 우리가 아는 바로는 $eos_galtaereth_her_color$의 놀이터가 되기 전에도 이곳은 섬조차 단단한 땅의 환상 이상을 주지 못하는 성난 바다 같았습니다.\n\n이 공간 더 깊이 들어가기 전에, 우리는 먼저 옛 제국이 그랬듯 이곳을 항해하는 법을 배워야 합니다. 그러려면 이곳에서 장막을 뚫고 전역에 일렁이는 파도의 패턴을 관찰합시다. 조류가 낮아지고 목적지가 뚜렷이 보일 때에야 아공간으로 뛰어들 것입니다.\n\n그때까지는 한순간도 경계를 늦춰서는 안 됩니다. 지금 이 영역을 배회하는 악몽이 §H$eos_evergloom_empire_alias$§!이(가) 몰락하기 전의 것들보다 훨씬 더 나쁠지도 모릅니다."
 elven_anorim_origin_events.203.a:0 "이곳에서 $eos_galtaereth_her_color$의 존재는 숨이 막힌다."
 elven_anorim_origin_events.203.b:0 "이곳에서 $eos_galtaereth_her_color$의 존재는 숨이 막힌다."
 elven_anorim_origin_events.204.name:0 "산산이 부서진 유리: 부풀어 오르는 일식"
 elven_anorim_origin_events.204.desc:0 "[eos_evergloom_exploration_ship.GetName]의 승무원들은 §H[anorim_evergloom_cluster_02.GetName]§!의 가장자리에 무사히 도착하자 안도감에 휩싸였습니다. 최초의 유배자들은 이제 우리 곁에 없을지 몰라도, 그들이 물려준 지혜가 이 위험한 여정에서 다시 우리를 인도하고 지켜 주었습니다.\n\n그리고 이제 그들의 유산을 떠올리는 것이 어울립니다. 우리가 도착한 곳은 그들 중 많은 이가 한때 고향이라 불렀을, 혹은 그에 가까웠을 곳이기 때문입니다.\n§H$eos_evergloom_empire$§!의 변경은 치명적이고 살기 힘든 곳으로 기억되지만, 한량없이 풍요로웠고 무수한 우주 정거장과 교역 전초 기지가 점점이 흩어져 땀과 피와 눈물이 한쪽으로 흘러가고 부가 반대쪽으로 돌아오는 곳이었습니다.\n오늘날의 많은 [root.GetSpeciesNamePlural]이(가) 옛 제국의 중심 성계를 탈출해 이곳에서 더 혹독하지만 어쩐지 덜 잔혹한 삶을 살아간 추방자와 노예, 환멸한 이상주의자들에게서 혈통을 찾을 수 있다는 것은 놀라운 일이 아닐지 모릅니다.\n\n우리는 귀환해 폐허와 공동묘지만 보게 될 것이라 각오했지만, 그럼에도 눈앞에 펼쳐진 참혹한 황폐함은 그 무엇으로도 대비할 수 없었습니다.\n고대의 고철이 흉터 난 소행성 주위를 떠다니고, 썩어 가는 금속 껍데기가 모든 행성 표면에 놓여 있으며, 문명의 상징인 불빛으로 밝은 세계는 단 하나도 없어 보입니다.\n\n그렇다면... 왜 앞뒤가 맞지 않는 호출과 방송의 성난 해일이 우리의 통신망에 밀려들고 있는 것일까요?"
 elven_anorim_origin_events.204.a:0 "경계하라! 무언가 맞지 않는다..."
 elven_anorim_origin_events.204.b:0 "경계하라! 무언가 맞지 않는다..."
 elven_anorim_origin_events.205.name:0 "산산이 부서진 유리: 어두운 공허"
 elven_anorim_origin_events.205.desc:0 "아무것도 아니었습니다.\n\n말 그대로 우리는 센서의 환각, 식별 가능한 근원도 검증 가능한 실체도 없는 유령 접촉을 향해 사격하고 있었던 것입니다...\n\n이상 현상은 일단 스스로 가라앉은 듯하며, 우리 컴퓨터도, 과학자도, 조상들의 경험도 무엇이 그런 오류를 일으켰는지 설명하지 못합니다.\n\n결국 §H[anorim_evergloom_cluster_02.GetName]§!에는 우리만 있는 듯하지만, 앞으로는 우리의 지각을 덜 믿어야 할지도 모릅니다..."
 elven_anorim_origin_events.205.a:0 "우리가 가는 곳에서는 눈 말고도 더 많은 것이 필요하다."
 elven_anorim_origin_events.205.b:0 "우리가 가는 곳에서는 눈 말고도 더 많은 것이 필요하다."
 elven_anorim_origin_events.206.name:0 "산산이 부서진 유리: 먼 반짝임"
 elven_anorim_origin_events.206.desc:0 "선조들의 회고록에는 §H[anorim_evergloom_cluster_03.GetName]§!에 대해 많은 말이 있지만 알려진 것은 적습니다. 대부분의 저자들은 이곳에 대해 경고담과 미신, 소문으로만 들었을 뿐입니다.\n\n그러나 모든 기록이 일치하는 한 가지는 이곳이 $eos_galtaereth_color$ 사제단에게 신성한 장소였다는 것이며, [eos_evergloom_exploration_ship.GetName]이(가) 거대한 항성의 부자연스럽게 강한 중력 우물에 의해 아공간에서 거칠게 뜯겨 나오면서 우리는 그 이유를 깨닫기 시작합니다...\n\n§R//예쁜 불빛을 쫓는 작은 나방들//§!\n\n도착한 지 얼마 지나지 않아 탐사대뿐 아니라 은하 전역의 모든 [root.GetSpeciesNamePlural]이(가) 골수 깊숙이 울려 퍼지는 $eos_galtaereth_her_color$의 잔인한 조롱을 느꼈습니다...\n\n우리의 침입이 지금까지 들키지 않았다 하더라도, 에버글룸의 조류가 우리를 $eos_galtaereth_her_color$의 제단 앞으로 끌고 왔을 무렵에는 기습의 이점이 더는 우리 편이 아니었습니다.\n\n그리고 우리는 다른 무언가의 주의도 끌게 된 듯합니다..."
 elven_anorim_origin_events.206.a:0 "전투 배치!"
 elven_anorim_origin_events.206.b:0 "전투 배치!"
 elven_anorim_origin_events.207.name:0 "산산이 부서진 유리: 희미한 아른거림"
 elven_anorim_origin_events.207.desc:0 "§H[anorim_evergloom_cluster_03.GetName]§!에서 마주친 수수께끼의 생물의 정체를 파악하면 앞서 겪은 항법 사고를 설명할 수 있을지도 모릅니다.\n옛 전설이 사실이라면 이것은 스타플레이어, 즉 §Y$eos_evergloom_ripples$§! 아래에 살며 영혼과 별 모두에게 저주라 일컬어지던 존재였을 것입니다.\n\n본성은 고독하지만 §H$eos_evergloom_empire$§!의 백성들은 그 하나하나가 그 자체로 군단이라 믿었고, 충분히 오랫동안 사이오닉 에너지를 탐식하게 두면 결국 장로 형태로 성숙한다고 믿었습니다.\n그러면 그 혐오스러운 존재는... 성장하는 스타플레이어의 양분이 되고 있다고 의심되는 식민지 하나를 통째로 말살하는 것을 §H$eos_evergloom_ruler$§!이(가) 승인할 만큼 끔찍한 위업을 이룰 수 있게 됩니다.\n\n그런 능력 중 하나, 곧 §H$eos_nebula_evergloom$§!을(를) 잇는 핵심 아공간 해류를 끊고 재구성하는 능력을 앞서 우리가 목격했다는 점을 감안하면, 옛 제국이 이 공포를 존재론적 위협으로 여긴 것도 놀라운 일이 아닐 것입니다."
 elven_anorim_origin_events.207.a:0 "닿을 수 없는 별의 고독을 우리는 상상할 수밖에 없다..."
 elven_anorim_origin_events.207.b:0 "닿을 수 없는 별의 고독을 우리는 상상할 수밖에 없다..."
 elven_anorim_origin_events.208.name:0 "산산이 부서진 유리: 희미한 반짝임"
 elven_anorim_origin_events.208.desc:0 "공포의 장막이 무겁게 드리운 채 [eos_evergloom_exploration_ship.GetName]이(가) §H[anorim_evergloom_cluster_04.GetName]§!의 해안에 아공간에서 빠져나왔습니다.\n§H$eos_evergloom_empire_guard$§!, 즉 한때 §H$eos_evergloom_empire$§!의 깨지지 않는 방벽을 이루던 제국 근위대는 제국 중심 성계로 가는 유일한 길을 지키며 이곳에 대규모로 주둔했었습니다.\n\n지금 §H$eos_evergloom_empire_guard$§!에게 남은 것은 금 간 뉴트로늄으로 덮인 음산한 묘비 무리로 보일 뿐입니다. 그것들은 의도가 있는 듯한 착각을 주며 우리를 향해 떠오고 있지만, 선내에서는 생명의 징후가 보이지 않습니다.\n하지만 이번에는 속지 않을 것입니다. §H$eos_nebula_evergloom$§!은(는) $eos_galtaereth_she_color$가 $eos_galtaereth_her_color$의 관 위에서 신성으로 올라서기를 꿈꾸었던 이들을 모욕하려고 꾸며 낸 조소 어린 인형극의 무대일 뿐임을 기억해야 합니다.\n\n그러나 그 결함 있는 사람들과 훗날 [root.GetSpeciesNamePlural]이(가) 될 추방자들 사이에 애정이 없었을지라도, 그들을 대신해 우리는 이 얇은 정의와 형벌의 겉껍질 아래 드러난 것에 여전히 구역질이 납니다. $eos_galtaereth_alias_color$의 분노가 아무리 정당하다 해도, 꿈과 욕망을 가진 불완전한 피조물인 우리의 자긍심을 부정하는 것은 신의 자리가 아닙니다."
 elven_anorim_origin_events.208.a:0 "전사자들을 마침내 존엄하게 묻어 주자."
 elven_anorim_origin_events.208.b:0 "전사자들을 마침내 존엄하게 묻어 주자."
 elven_anorim_origin_events.209.name:0 "산산이 부서진 유리: 스러지는 빛무리"
 elven_anorim_origin_events.209.desc:0 "우주에서는 전투가 남긴 금속의 삐걱거림과 플라스마의 지글거림이 들리지 않습니다. 그러나 줄에서 풀려난 인형들이 소리 없이 구겨지고 부서지는 모습을 지켜보는 동안, 우리 마음속에서는 공허마저 부드러운 자장가를 부르는 것이 들립니다.\n\n이미 $eos_galtaereth_color$에게 삼켜진 이들의 생명은 되돌릴 수 없지만, 적어도 기억되고 복수를 받음으로써 그들의 영혼이 평안을 찾을 수 있으리라 믿고 싶습니다.\n\n그렇지 않다 하더라도 산 자들에게는 위안이 되기를 바랍니다. 앞으로 남은 것에 맞서려면 우리에게는 모든 명료함과 결의가 필요할 것이기 때문입니다."
 elven_anorim_origin_events.209.a:0 "신이라 해도 상처 입은 필멸자의 분노를 구해서는 안 된다."
 elven_anorim_origin_events.209.b:0 "신이라 해도 상처 입은 필멸자의 분노를 구해서는 안 된다."
 elven_anorim_origin_events.2010.name:0 "산산이 부서진 유리: 덧없는 섬광"
 elven_anorim_origin_events.2010.desc:0 "$eos_ship_design_evergloom_starflayer_elder$와(과)의 조우로 인한 우려는 근거가 있었습니다. 옛 제국의 중심부 벼랑 끝에 서 있음에도, 이 지점을 지나면 더 이상 §Y$eos_evergloom_ripples$§!이(가) 감지되지 않습니다. §H$eos_evergloom_empire_alias$§!의 옛 수도를 둘러싸던 십여 개의 별 중 어느 것도 닿을 수 없습니다. 그 빛은 저 멀리서 쓸쓸히 깜박일 뿐입니다.\n\n그러나 §Y$eos_evergloom_tear$§!로 가는 일반적인 길을 찾을 가능성은 어두워 보이지만, 우리 §G여신§!의 사랑 어린 선물을 잊어서는 안 됩니다.\n§G$EOS_EVERGLEAM_WORMHOLE$§!은(는) 시간과 거리를 거스르고 우리 민족의 집단 기억을 통해 이동하게 해 줍니다.\n유일한 장애물은... 이야기가 §H[anorim_evergloom_cluster_05.GetName]§!이라 묘사하는 성계를 직접 눈으로 본 조상이 극히 드물다는 점입니다. 몇 안 되는 예외들조차 그곳을 좋게 기억하지 않았고, 영원한 §H$eos_evergloom_ruler$§!과 그녀의 무자비한 위계가 철의 손아귀로 옥죈 그 억압적인 우리를 잊고 싶어 했던 듯합니다.\n\n그러나 한 가지 가능성이 희망의 불을 계속 밝혀 줍니다! §H$eos_evergloom_empire_guard_alias$§!의 낡은 함선들과의 전투를 마친 뒤, 우리는 잔해에서 여러 기념품과 데이터 드라이브, 블랙박스를 회수할 수 있었습니다. 특히 주목할 것은 기함 §Y$eos_evergloom_empire_titan$§!에 보존된 기억입니다. 그 함선의 굴하지 않는 강인함이 전쟁과 세월의 참화로부터 많은 기록을 지켜 냈습니다. 제국 근위병들의 기억을 우리의 이야기에 편입하는 것이 우리가 공유한 과거의 회상을 마침내 완성하고, 우리 모두를 위해 훨씬 다정한 결말을 쓰는 길일지도 모릅니다."
 elven_anorim_origin_events.2010.a:0 "우리는 잊으러 온 것이 아니라 과거를 넘어서러 왔다."
 elven_anorim_origin_events.2010.b:0 "우리는 잊으러 온 것이 아니라 과거를 넘어서러 왔다."
 elven_anorim_origin_events.2011.name:0 "산산이 부서진 유리: 눈부신 깜박임"
 elven_anorim_origin_events.2011.desc:0 "수많은 천년 동안 우리 민족은 $eos_galtaereth_alias_color$를 숭배했습니다. $eos_galtaereth_she_color$가 부여한 힘 덕분에 §H$eos_evergloom_empire$§!이(가) §H$eos_nebula_evergloom$§!의 나머지를 복속시키고 이 악몽 같은 영역에서 번성할 수 있었습니다.\n\n그러나 $eos_galtaereth_her_color$의 축복 중 어느 것도 공짜로 주어진 선물이 아니었습니다. 요청한 힘의 양만큼 그 가치를 훨씬 웃도는 대가를 치러야 했습니다. 그럼에도 $eos_galtaereth_her_color$의 조건은 받아들여야 했습니다. $eos_galtaereth_her_color$의 총애를 얻지 못한 자는 무력해지기 때문입니다. 그리고 무력한 자는 언젠가 힘을 원하는 다른 누군가의 손에 $eos_galtaereth_her_color$의 제단에 바쳐질 것이었습니다.\n\n그런 토대 위에 옛 제국이 세워졌고, 그 토대가 무너지면서 §H$eos_evergloom_empire_alias$§!도 무너질 것이었습니다.\n§H$eos_evergloom_empire_guard$§!의 회상에 따르면, 운명적인 반란의 불씨를 댕긴 것은 가장 지고한 존재인 §H$eos_evergloom_ruler$§!조차 $eos_galtaereth_color$의 점점 감당할 수 없어지는 대가를 더는 치를 수 없게 된 때였습니다.\n\n계획된 쿠데타의 날, 모든 것이 계획대로 진행될 것이었습니다. $eos_galtaereth_alias_color$는 거대한 속박 의식으로 제압되었고, 계약은 끊어졌으며, $eos_galtaereth_her_color$를 이 현실에서 영원히 추방할 준비가 모두 갖추어졌습니다.\n\n물론 이야기의 이 부분은 우리에게 익숙합니다..."
 elven_anorim_origin_events.2011.a:0 "승리의 순간에도 승리만으로는 충분하지 않았다."
 elven_anorim_origin_events.2011.b:0 "승리의 순간에도 승리만으로는 충분하지 않았다."
 elven_anorim_origin_events.2012.name:0 "산산이 부서진 유리: 눈부신 깜박임"
 elven_anorim_origin_events.2012.desc:0 "$eos_galtaereth_her_color$를 버릴 채비를 하면서도 후원자의 가르침을 여전히 저버리지 못한 음모자들은 자유의 보장보다 힘의 유혹을 뿌리치지 못했습니다...\n\n계획된 신 살해 전날 밤 또 다른 장막의 존재가 모습을 드러냈습니다. $eos_anoriel_her_color$의 신중하라는 호소가 한동안 그들의 손을 멈추게 했으나, 결국 바꾼 것은 거의 없었습니다.\n음모자들의 대열을 가른 것은 사소한 분열, 즉 $eos_anoriel_alias_color$의 경고를 마음에 새기고도 원래의 계획을 진행하려는 이들과, 듣지 않기로 한 이들 사이의 균열뿐이었습니다.\n후자가 압도적 다수였고, 그리하여 $eos_anoriel_color$의 추종자들은 새 질서의 적이 되었습니다.\n\n그 유배자들의 나머지 이야기는 우리가 압니다. 그것이 곧 우리의 이야기이니까요.\n\n다른 쪽의 관점에서는, §H$eos_evergloom_empire_guard$§!의 병력이 그 오랜 역사 속에서 유례없는 맹렬함으로 생존을 위해 싸웠고, $eos_galtaereth_her_color$의 상처에서 쏟아져 나온 공포의 물결에 맞서 전선을 지켜 냈습니다. 그러나 그들이 기괴한 홍수가 휩쓴 성계마다 피로 대가를 치르게 했음에도, 물결이 거듭될수록 §H$eos_evergloom_empire_guard_alias$§!은(는) 지쳐 갔고 결국 무너졌습니다. 제국의 나머지는 그 뒤 불과 며칠 만에 삼켜졌습니다.\n\n스스로를 구하지는 못했으나, 그들의 저항은 의도치 않게 우리 선조들이 §H$eos_nebula_evergloom$§!을(를) 탈출하기에 딱 충분한 시간을 벌어 주었습니다."
 elven_anorim_origin_events.2012.a:0 "우연이 부리는 아이러니는 씁쓸하다."
 elven_anorim_origin_events.2012.b:0 "우연이 부리는 아이러니는 씁쓸하다"
 elven_anorim_origin_events.301.name:0 "산산이 부서진 유리: 눈부신 광채"
 elven_anorim_origin_events.301.desc:0 "§H$eos_evergloom_empire$§!의 마지막 숨결에 대한 전체 그림이 우리 기억의 캔버스 위에 완성되면서 §H[anorim_evergloom_cluster_05.GetName]§!로 가는 길이 활짝 열렸습니다.\n\n마지막 나날을 떠올리면 우리가 어떤 공포와 마주해야 할지 알 수 없습니다. 그럼에도 우리는 이미 상상조차 할 수 없는 악몽과 맞서 왔고 굴하지 않고 여기까지 왔습니다.\n한때 둘로 갈라졌다가 이제 하나의 공통된 꿈으로 화해한 유산의 후예로서, [root.GetName]이(가) 받아들일 수 있는 유일한 결말로 이 막을 끝내는 것은 우리의 몫입니다...\n\n몰락에서 도피에 이르기까지 우리는 사그라들기에는 너무나 비극적인 연약함의 이야기를 이어 왔습니다. 흔들림 없는 믿음으로 운명을 적으로 삼았으니, 우리는 이 동화를 투쟁으로 끝맺고, 이루어 낼 것입니다..."
 elven_anorim_origin_events.301.a:0 "...마침내 자유."
 elven_anorim_origin_events.301.b:0 "...마침내 자유."
 elven_anorim_origin_events.302.name:0 "산산이 부서진 유리: 나부끼는 반짝임"
 elven_anorim_origin_events.302.desc:0 "위대한 문명의 뛰는 심장을 지탱하던 죽은 항성의 사건의 지평선에서 [eos_evergloom_exploration_ship.GetName]이(가) 나타나자마자, 그 이름을 공유하는 $eos_galtaereth_she_color$가 증오와 경멸을 품고 그 어느 때보다 게걸스럽게 $eos_galtaereth_her_color$의 검은 촉수를 우리를 향해 뻗었습니다.\n\n신성한 피와 세속의 피가 스며든 이 성계가 §H[anorim_evergloom_cluster_05.GetName]§!임은 의심할 여지가 없으며, $eos_galtaereth_she_color$는 이곳을 $eos_galtaereth_her_color$의 소굴로 삼았습니다.\n이제 폐허를 보는 데 익숙해졌지만, $eos_galtaereth_color$가 옛 제국의 모성에 남긴 황폐함은... 다르게 느껴집니다. 의도성이 뚜렷이 감지되지만, 겉으로는 예술을 닮았을 뿐 그 아래에 있는 것은 공허하고 끝없이 만족을 모르는 잔혹함의 정교한 표현에 불과합니다.\n\n이 생명 없는 공간에 여전히 정적이 감돌지만, $eos_galtaereth_her_color$의 심연의 거미줄이 격렬하게 요동칩니다. 우리가 깨운 무언가가 이곳과 장막을 가르는 종잇장 같은 장막을 찢고 나오는 것은 시간문제입니다."
 elven_anorim_origin_events.302.a:0 "기어 나오는 것은 무엇이든 짓밟고, 저 저주받은 거미줄을 걷어 내라."
 elven_anorim_origin_events.302.b:0 "기어 나오는 것은 무엇이든 짓밟고, 저 저주받은 거미줄을 걷어 내라."
 elven_anorim_origin_events.303.name:0 "산산이 부서진 유리: 빛나는 광휘"
 elven_anorim_origin_events.303.desc:0 "정적이 돌아왔지만 평화는 아닙니다. $eos_galtaereth_her_color$의 그림자 같은 촉수가 전례 없는 탐욕으로 우리를 향해 손을 뻗고 있습니다. 그리고 어쩌면 기억 속에서 처음으로... 절박함일까요?\n그러나 그것은 불가피한 것을 미루려는 부질없는 몸부림일 뿐입니다.\n\n$eos_galtaereth_alias_color$는 $eos_galtaereth_her_color$가 이 우주에서 환영받을 기간을 이미 오래전에 넘겼고, 이제 우리의 환대를 거둘 때가 왔습니다. 추방 의식은 우리가 지키도록 태어난 형식에 불과하며, 그 정확한 절차는 숨을 들이쉬는 반사 작용처럼 우리 민족의 공유된 기억에 새겨져 있습니다.\n\n신성한 힘에 대한 갈망 끝에 고대인들의 죄는 신의 뒤틀린 연회에 대한 초대장이 되었습니다. 우리가 이제 마지막으로 그 초대에 응하는 것은 잔치를 즐기거나 잡아먹히기 위해서가 아니라 오직 식사를 망치기 위해서입니다."
 elven_anorim_origin_events.303.a:0 "비참한 배를 채워라. 그것이 마지막이 될 것이다."
 elven_anorim_origin_events.303.b:0 "비참한 배를 채워라. 그것이 마지막이 될 것이다."
 elven_anorim_origin_events.304.name:0 "산산이 부서진 유리: 반짝이는 에버글림"
 elven_anorim_origin_events.304.desc:0 "복수는 결코 우리의 목표가 아니었기에, 탐식하는 자가 허공에 발톱을 휘두르는 모습은 오직 연민만을 불러일으킵니다.\n그러나 $eos_galtaereth_her_color$의 촉수가 우리 영혼을 움켜쥔 손아귀를 풀고, 더는 그림자 실에 감싸이기를 허락하지 않는 무수한 별들의 타오르는 빛에서 움츠러들었을 때 [root.GetName]을(를) 덮친 안도감보다 큰 기쁨은 없습니다.\n\n살아 있는 이 누구도 태어난 이래 처음으로 우리는 살아 있다는 것이 무엇인지 이해합니다. 어깨 너머를 살피지 않고 내일을 바라보는 것이 무엇인지. 오랜 습관은... 하룻밤 사이에 사라지지 않을 수도 있습니다. 그리고 그중 일부는 붙들고 있는 편이 나을지도 모릅니다. 자만이 과거의 실수를 되풀이하게 만들지 않도록 말입니다. 하지만 적어도 우리는 다시는 먹이가 되지 않을 것입니다. 싸우기를 거부하는 것이 언제나 약함의 표현은 아니며, 오늘 우리는 궁지에 몰렸을 때 어떻게 되받아치는지 보여 주었습니다.\n\n너무나 긴 이 이야기의 마지막 장을 희망찬 어조로 닫으며, 우리가 만든 기억들은 다시는 악몽 속에서 우리를 괴롭히지 않을 것입니다. 그것들은 우리 앞길을 밝히는 빛이 되어, 어떤 투쟁도 무의미하지 않음을 일깨워 줄 것입니다."
 elven_anorim_origin_events.304.a:0 "§G오랜 악몽이 타오르면서 우리의 꿈은 투명해진다.§!"
 elven_anorim_origin_events.304.b:0 "§G오랜 악몽이 타오르면서 우리의 꿈은 투명해진다.§!"
 eos_anorim_origin_ending_A_modifier:0 "에버글림: 회상"
 eos_anorim_origin_ending_A_modifier_desc:0 "가장 어두운 밤 한가운데서 끝없는 악몽이 끝나고, 눈부신 광휘가 새로운 하루를 열었습니다."
