 eos_evergloom_ripples:0 "에버글룸 파문"
 eos_evergloom_ripples_desc:0 "$eos_nebula_evergloom$의 초공간 항로는 변덕스러워, 장막의 영향 아래 차오르고 이지러집니다. 조류가 거친 동안 아공간을 통과하려는 함선들에 무슨 일이 일어나는지는 아무도 모릅니다."
