 d_drow_planetary_cheel_krezust_desc:0 "우리 민족을 안전한 곳으로 실어 온 방주선이 처음 착륙한 고대의 장소이자 우리의 첫 도시입니다. 오랜 세월 끊임없이 확장되어 지금은 끝없이 펼쳐진 거대 도시이며, 행성과 우리 문화 양쪽의 수도로 여겨집니다.\n§G테라포밍 시 에큐메노폴리스로 전환됩니다!§!"
