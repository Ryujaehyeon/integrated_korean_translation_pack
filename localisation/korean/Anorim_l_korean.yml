 elven_anorim_origin_events.0001.name:0 "§R고유 기원 오류!§!"
 elven_anorim_origin_events.0001.desc:0 "이 플레이어에게 §Y$origin_drow_prismatic_refuge$§! 기원을 올바르게 설정할 수 없었습니다!\n\n원인: §R전역 이벤트 대상 불일치§!\n세부 사항: §H[capital.solar_system.GetName]§!이(가) §H[anorim_star.GetName]§!와(과) 같은 값이 아닙니다\n또는: §H[anorim_star.GetName]§!이(가) 존재하지 않습니다\n\n§R참고:§! 이 기원은 플레이어 한 명만 지원할 수 있습니다. 중복된 플레이어는 이 기원의 메커니즘과 상호작용할 수 없습니다.\n새 게임을 시작하고 §Y$origin_drow_prismatic_refuge$§! 기원을 가진 제국이 하나만 생성되도록 설정하십시오.\n문제가 계속되면 신고하기 전에 Stellaris 버전 불일치와 모드 충돌을 확인하십시오."
