l_korean:
 drow_system_eilistraee_initializer_NAME:0 "다채색의 낙원"
 drow_system_eilistraee_initializer_DESC:0 "§L우리 민족은 프리즘 같은 항성과 그 짝인 블랙홀이 만들어 내는 알록달록한 하늘 아래 살아갑니다.§!\n\n$system_initializer_DESC$"
 trait_drow_anorim_immortality:0 "에버글림"
 trait_drow_anorim_immortality_desc:0 "그들은 두려움에 떨며 별들 속으로 달아났고 그곳에서 죽음을 찾았습니다. 그러나 별들 사이에서 그들은 사랑 속에 살았고, 그곳에서 죽음은 그들에게 닿지 못했습니다."
 trait_drow_anorim_curse:0 "에버글룸"
 trait_drow_anorim_curse_desc:0 "$eos_galtaereth_she_color$는 한때 $eos_galtaereth_her_color$의 신성을 탐낸 자들에 대한 복수를 아직 끝내지 않았습니다."
 origin_drow_prismatic_refuge:0 "프리즘 피난처"
 origin_drow_prismatic_refuge_desc:0 "§R경고: ['concept_psionic_ascension']을(를) 제외한 모든 승천 경로가 차단됩니다.§!\n\n§R기괴한 악§!을 피해 달아나던, 몰락한 제국의 잔존자들을 실은 방주선은 기적처럼 낙원, 곧 $eos_galtaereth_her_color$의 추적으로부터 은신처를 제공하는 은하 유일의 항성을 우연히 발견했습니다. 다시 내일을 꿈꿀 만큼 힘과 수를 회복한 생존자들은 되살아난 희망을 품고 별들로 시선을 돌립니다."
 origin_tooltip_drow_prismatic_refuge_effects:0 "- 스토리 이벤트 연쇄: ['concept_eos_anorim_prismatic_refuge_chain']$NEW_LINE$- 맞춤 성단$NEW_LINE$- $HOME_SYSTEM$$TABBED_NEW_LINE$- ['concept_eos_planetary_nebula'] 안에 위치$TABBED_NEW_LINE$- ['concept_eos_hazard_black_hole'] 포함$TABBED_NEW_LINE$- ['concept_eos_dark_tithe']로부터 보호$NEW_LINE$- 시작 승천 특전:$TABBED_NEW_LINE$- ['concept_eos_ap_mind_over_matter', $ap_mind_over_matter$]"
 origin_tooltip_drow_prismatic_refuge_negative_effects:0 "- 상황: ['concept_eos_dark_tithe']$NEW_LINE$- $SPECIES_TRAITS$ ['concept_eos_anorim_trait_curse']"
 civic_drow_eilistraee:0 "축복받은 아름다움"
 civic_drow_eilistraee_desc:0 "이 사회에는 뿌리 깊은 음유시인의 전통이 있습니다. 그들의 역사 대부분은 정교한 무용 공연에서 깊은 상호작용 경험에 이르기까지 다양한 예술 형태로만 기록되어 있습니다. 모든 것에서 의미를 찾는 이에게는 비극과 슬픔조차 영감의 샘일 뿐입니다."
 civic_drow_eilistraee_tooltip_effects:0 ""
 elven_councilor_eilistraee:0 "후원 장관"
 elven_councilor_eilistraee_desc:0 "$elven_councilor_eilistraee$은(는) 예술 운동의 발전을 육성하여, 아름다움이 어디서 싹트든 만개하고 적절히 재정 지원을 받도록 보장합니다."
 personality_eilistraeean_personality:0 "오르테 다로넨"
 personality_eilistraeean_personality_desc:0 "오르테 다로넨은 드로우어로 '성기사'를 뜻하며, 은하에 질서를 가져오는 것이 자신들의 신성한 의무라고 믿습니다. 가능하다면 평화적으로, 필요하다면 무력으로 말입니다. 우정이 확립되면 극도로 충성스러운 것으로 알려져 있습니다."
 EMPIRE_DESIGN_drow_civ1:0 "아노리엘의 아이들"
 EMPIRE_DESIGN_drow_civ1_desc:0 "애도의 노래에 보존된 이야기에 따르면 아노림은 \"거대한 악\", 즉 아노림의 잃어버린 선조들에게 한때 부당한 일을 당한 뒤로 줄곧 복수를 벼르고 있는 복수의 신 갈타에레스를 피해 고향을 떠났습니다.\n그들은 또 다른 여신 아노리엘, 곧 그들의 어두운 길을 밝혀 준 희미한 희망의 빛에게 구원받았습니다. 수호신의 인도 덕분인지 순전한 행운 덕분인지, 고대의 함선은 대를 이어 허공을 건너는 여정에서 살아남았습니다.\n마침내 그들은 집요한 적이 닿을 수 없는 별 하나, 피난처를 찾아냈습니다. 아노리엘의 아이들이 문명을 재건하고, 어쩌면 언젠가는 신의 저주에 맞서는 법까지 배울 수 있을지도 모르는 안전한 항구입니다.§!\n"
 EMPIRE_DESIGN_drow_civ1_nomads_dlc_desc:0 "$EMPIRE_DESIGN_drow_civ1_desc$"
