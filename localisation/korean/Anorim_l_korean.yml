 eos_evergloom_tear:0 "심연의 균열"
 eos_evergloom_tear_desc:0 "이곳에서 이 우주와 장막을 가르는 장벽이 산산이 부서졌습니다. 신성한 피로 얼룩진 파편들에 비치는 것은 모든 빛을 삼키려 갈망하는 뚫을 수 없는 어둠뿐입니다."
