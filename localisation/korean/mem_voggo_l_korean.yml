l_korean:
 mem_voggo_dig_site:0 "구름 속에서"
 mem_voggo_dig_site_desc:0 "§Y[From.Planet.GetName]§!의 초고층 대기 안에 대형 스테이션이 떠 있습니다. \n\n시간의 흐름으로 많이 풍화되었지만 외관은 꽤나 고급스럽습니다. 스테이션 자체는 오래 전에 버려진 것 같습니다."
 mem_voggo.1.name:0 "대기실"
 mem_voggo.1.desc:0 "§Y베스퍼§!에 있는 기지의 호화로운 내부를 정리하고 목록화하는 데 상당한 노력이 필요했습니다. 입은 피해로 인해 비틀린 통로가 위험해졌고, 내부 공기는 고장난 생명 유지 시스템으로 인해 위험하게 불안정해졌습니다. \n\n이 모든 것 중 가장 이상한 점은 장식입니다. 모든 방에는 최소한 하나의 동상이나 같은 인물이 웅장한 포즈를 취하고 있는 초상화가 있습니다."
 mem_voggo.2.name:0 "클론들을 보내라"
 mem_voggo.2.desc:0 "§Y베스퍼§!의 깊은 내부로 진입한 고고학자들은 죽은 시체들을 발견하기 시작했습니다. 그들 중 일부는 총격, 칼날 및 둔기 등에 의해 사망했지만, 다른 이들은 생명 유지 장치의 고장으로 사망한 것으로 보입니다. \n\n모든 시체는 유전적으로 동일하며, 탑승한 초상화와 강인한 유사성을 보입니다. 그러나 서로 다른 시체들은 발달과 건강 상태가 다르게 나타나며, 일부는 다른 시체들에 비해 심각하게 변형되었거나 두개골 부위가 축소된 모습을 보입니다. \n\n[Leader.GetName]은 그들 모두가 동일한 개인의 클론으로, 서로 다른 성공률로 복제된 것이라고 믿고 있습니다. 가장 퇴화된 것들은 아마도 여러 세대에 걸친 클론 기술의 결과일 것입니다."
 mem_voggo.3.name:0 "복제 연구소"
 mem_voggo.3.desc:0 "정거장의 중앙핵 근처에서 [Leader.GetName]는 복제를 위해 만들어진 방 여럿을 발견했습니다. 장비 대부분이 파괴되어있는 것으로 보아 대규모 전투가 벌어진 곳으로 보입니다. 마치 누군가가 내부의 무언가를 꺼내려고 한 듯이 복제기의 내에는 반 정도 성장한 유체들과 박살난 측정기들이 존재합니다."
 mem_voggo.4.name:0 "지성소"
 mem_voggo.4.desc:0 "지금까지 우리는 이 정거장이 버려졌다고 믿었습니다. 우리는 잘못 생각했습니다.\n\n정거장 가장 안쪽에서 [Leader.GetName]이(가) 외부로부터 차단된 밀폐 구역을 발견했습니다.\n\n그 안에서 [Leader.GetSheHe]은(는) 정거장의 초상화와도 외모가 같은, 가사 상태의 살아 있는 외계 생명체를 발견했습니다. 기형적인 유전적 결함이 없는 것으로 보아, 이 정거장에 시신이 나뒹구는 클론들의 원본 주형이었을 가능성이 높습니다. 깨어난 그것은 우리와 대화하기를 원했습니다."
 mem_voggo.4.pur:0 "상관 없다. 죽여라."
 mem_voggo.4.swarm:0 "포식하라."
 mem_voggo.5.name:0 "보고 대왕"
 mem_voggo.5.desc:0 "§H정지 챔버 옆에서 그를 기다리며 호화로운 옥좌에 앉아 있자, 그는 이제 눈높이보다 약간 위에서 조용히 떠다닙니다.§!\n\n아, 누군가 나를 이 구속에서 풀어 주러 왔군!\n\n§H그는 거드름을 피우며 헛기침을 합니다.§!\n\n부디 내 소개를 하게 해 주게. 나는 §S보고 대왕§!, 위엄 있는 자, 현자, 기름 부음 받은 자, 욕된 자, 기피된 자, 배신당한 자, 그리고 추방된 자로도 알려져 있다네."
 mem_voggo.5.a:0 "환영합니다."
 mem_voggo.5.a.tooltip:0 "§Y보고 대왕§!이 새로운 §S총독§!으로 합류함."
 mem_voggo.5.b:0 "사양하겠습니다."
 mem_voggo.5.c:0 "당신에 대해 더 말씀해 주시겠습니까?"
 mem_voggo.5.c.responce:0 "오, 이것은 음모와 배신으로 가득 찬 스릴 넘치는 이야기입니다. 몇십 년 전 이 이야기에 관한 책을 썼지만, 실수로 음식 기계 중 하나를 통해 처리해버린 것 같습니다. 걱정하지 마십시오, 제가 또 다른 책을 쓸 것입니다. 지금은 요약본을 드리겠습니다.\n\n제가 속한 §YVorkun Nation§!은 한때 은하계 무대에서 강력한 제국이었고, 저는 그 지도자였습니다. 저만 그런 것은 아니었지만, 다른 이들과는 다른 재능을 지니고 있었습니다. 저는 대부분이 보지 못하는 것들을 볼 수 있었습니다. 사람들은 저를 존경하며 중요한 문제에 대해 항상 저에게 상담했습니다. 제 끝없는 지혜를 인정해주었죠. 한동안 좋은 시절이었습니다.\n\n하지만 예지력과 권력을 부여받는 것은 끔찍한 저주가 될 수 있습니다. 다른 보르쿤들이 행복한 무지 속에서 삶을 살아가는 동안, 저는 끔찍한 재앙을 예견했습니다. 벽에 적힌 글을 보았고, 대부분은 외설적인 낙서였습니다.\n\n저는 대의회 앞에 나아가 그들에게 선택이 있다고 말했습니다 - 저에게 절대 권력을 주거나 멸망하든지. 그들은 저에게도 선택이 있다고 말했습니다 - 추방 아니면 죽음. 그들은 그들의 선택을 했고, 저는 제 선택을 했습니다. 보아하니, 제가 옳았고 그들은 틀렸습니다."
 mem_voggo.5.d:0 "추방되었다고 하셨습니까?"
 mem_voggo.5.d.responce:0 "이곳은 나의 개인 기지이자, 나의 안전한 피난처였습니다. 추방된 후 도착했을 때, 나는 친구, 동맹, 동료가 전혀 없었고, 나 스스로를 만들어낼 수밖에 없었습니다. 나의 무한한 지성을 나눌 수 있는 사람이 아니라면 누가 이 자격을 갖출 수 있을까요? 그래서 나는 몇 대의 클론 기술 기계를 구입하고 작업을 시작했습니다. \n\n하지만 과정은 내가 예상했던 것보다 더 결함이 많았습니다. 내 클론들은 나와 같은 인내심과 연민을 지니지 않았습니다. 많은 이들이 나에게 등을 돌렸습니다. 내가 가장 깊은 성소에서 피신하려 할 때, 그들은 서로를 공격했고, 각자 자신을 군대로 클론하려 했습니다. 곧 첫 번째 세대의 클론들은 죽었지만, 각자 자신의 클론을 남겼습니다. 세대가 거듭될수록 그들은 더욱 수가 많아지고 정신이 나빠졌으며, 생명 유지 장치가 더 이상 그들을 견딜 수 없게 되었습니다. 나는 나만의 장비로 보호받고 있었고, 그들은 질식해 죽었습니다. \n\n한동안은 재미있었습니다. 하지만 그들이 모두 죽어서 기쁩니다."
 mem_voggo_trait:0 "보고 대왕"
 mem_voggo_trait_desc:0 "보고 대왕은 가장 위대한 상상을 하는 천재이자 선견지명이 있습니다. 모두가 그를 경외합니다."
 mem_voggo_trait_ruler:0 "$mem_voggo_trait$"
 mem_voggo_trait_ruler_desc:0 "$mem_voggo_trait_desc$"
 mem_voggo_site:0 "구름 속에서"
 mem_voggo_site_desc:0 "거대한 정거장이 §Y베스퍼§!의 상층 대기에 떠 있습니다.\n\n외부는 시간의 흐름과 강력한 바람에 손상되고 심하게 풍화되었지만, 한때의 호화로운 설계 흔적이 여전히 보입니다. 오래전에 버려진 것으로 보입니다."
 leader_trait_mem_voggo_trait:0 "보고 대왕"
 leader_trait_mem_voggo_trait_desc:0 "보고 대왕은 가장 통찰력 있는 천재이자 상냥한 선지자입니다. 그와 접촉하는 모든 이는 그의 위엄에 경외감을 느낍니다."
 leader_trait_mem_voggo_trait_ruler:0 "$leader_trait_mem_voggo_trait$"
 leader_trait_mem_voggo_trait_ruler_desc:0 "$leader_trait_mem_voggo_trait_desc$"
 mem_voggo.5.c.response:0 "나는 한때 위대하고 풍요로운 §Y보르쿤 공화국§!의 통치자였소, 그 이름을 알아보겠소?\n\n모르겠소? 그럴 줄 알았소... 그들에게 마땅한 결과지.\n\n이제 마침내 자유로워졌으니, 나의 서비스를 제안하게 해 주시오. 나는 그대가 만나 볼 가장 유능한 행정가요."
 mem_voggo.5.d.response:0 "오, 이건 음모와 배신, 반역이 가득한 스릴 넘치는 이야기라오. 수십 년 전에 그에 관한 책을 썼는데, 아무래도 실수로 식량 제조기 중 하나에 넣어 처리해 버린 것 같소. 걱정 마시오, 다른 책을 쓸 것이니. 지금은 요약본을 들려주겠소.\n\n내가 태어난 §Y보르쿤 공화국§!은 한때 은하 무대의 강력한 제국이었고, 나는 선출된 지도자였소. 내 권력이 절대적이지는 않았지만, 나는 다른 이들에게는 없는 재능을 타고났소. 대부분에게 보이지 않는 것을 볼 수 있었소. 사람들은 나를 우러러보며 중요한 문제를 상담했고, 나의 끝없는 지혜를 인정했소. 한동안은 좋은 시절이었소.\n\n§H그는 누가 봐도 연극적인 효과를 노리며 한숨을 내쉽니다.§!\n\n그러나 선견지명과 권력을 타고난다는 것은 끔찍한 저주가 될 수 있소. 다른 보르쿤들이 축복받은 무지 속에서 살아가는 동안, 나는 끔찍한 재앙을 예견했소. 벽에 쓰인 글씨를 보았는데, 대부분은 음란한 낙서였소.\n\n나는 대원로원 앞에 나서서 그들에게 선택지가 있다고 말했소. 내게 절대 권력을 주든지 멸망하든지. 그들은 내게도 선택지가 있다고 했소. 추방이냐 죽음이냐. 그들은 자신의 선택을 했고 나도 나의 선택을 했소. 결과를 보아하니 내가 옳았고 그들이 틀렸소."
 mem_voggo.5.e:0 "이 정거장에서 무슨 일이 있었습니까?"
 mem_voggo.5.e.response:0 "오, 이 나의 개인 정거장 말이오? 나의 안식처이자 은신처였소. 뭐, 그래야 했지만 일이 의도대로 풀리지 않았소.\n\n추방지에 도착했을 때 나는 친구도, 동맹도, 동료도 모두 잃은 상태였으니 직접 만들 수밖에 없었소. 나의 무한한 지성을 함께 나눌 이가 아니면 누가 그 자리에 어울리겠소? 그래서 복제 기계를 몇 대 구해 작업을 시작했소.\n\n그러나 결과는 예상보다 훨씬 불완전했소. 내 복제체들은 나와 같은 수준의 인내심과 연민을 타고나지 못했소. 그들은 함께 음모를 꾸며 나에게 등을 돌렸소.\n\n내가 가장 안쪽 성소로 피신하자 그들은 서로에게 등을 돌려, 각자 자신을 복제해 군대를 만들고 우위를 차지하려 했소. 나는 성소의 안전한 곳에서 계속 지켜보았소. 곧 1세대 복제체들은 죽었지만 그들의 복제체를 남겼소.\n\n세대가 거듭될수록 그들은 수가 늘어나는 만큼 이성을 잃어 갔고, 마침내 생명 유지 장치가 늘어나는 인구를 견디지 못하게 되었소. 그들이 질식하는 동안 나는 나만의 개인 장비로 보호받았소.\n\n지속되는 동안은 즐거웠지만, 이제 그들이 모두 죽어서 다행이오."
 mem_voggo.5.f:0 "왜 정지 상태에 있었습니까?"
 mem_voggo.5.f.response:0 "§H그의 목소리에서 짜증이 뚜렷이 느껴집니다...§!\n\n그대는 이 방 밖에 나가 보았을 것 아니오. 내 복제체들이 남긴 참상을 보았을 것이오. 내가 대체 어디로 갈 수 있었겠소? 통신 중계기까지 꺼져 있으니 도움을 요청하는 것도 선택지가 아니었소."
 mem_voggo.7.name:0 "버려진 스테이션"
 mem_voggo.7.desc:0 "[From.GetName] 성계에 진입하자, 우리 센서가 인근 가스 거성을 공전하는, 버려진 것으로 보이는 정거장을 발견했습니다. 그러나 초기 스캔 결과 일부 시스템은 아직 온전할 수도 있습니다."
 mem_voggo.7.a:0 "탐험해 봅시다."
 mem_voggo.100.name:0 "제안"
 mem_voggo.100.desc:0 "보고가 몹시 들뜬 모습으로 알현실에 들어섭니다.\n\n§T\"좋은 생각이 떠올랐소! 흥분을 가라앉히도록 노력해 보시오. 나의 지난 복제 계획이 역사가들이 굳이 *이성의 참담한 붕괴*라고 부르는 결과로 끝난 것을 기억할지도 모르겠소. 부당한 표현이오. 기껏해야 지나치게 열정적인 동료 검토 과정이었을 뿐이오.\n\n그러나 근본적인 개념은 흠잡을 데가 없었소. 잘못은 완벽함의 불완전한 사본들이 존재하도록 허용한 데 있었소. 이론상으로는 내가 수십 년을 들여 바로잡은 유감스러운 실수요.\n\n이번에는 다를 것이오. 상상해 보시오. 더 많은 보고들! 하나는 제국을 다스리고, 다른 하나는 자문하고, 또 다른 하나는 제국을 대표하는 것이오! 생산성은 최소 수백 퍼센트 증가할 것이오! 물론 보수적으로 추정한 것이지만...\"§!"
 mem_voggo.100.a:0 "진행해!"
 mem_voggo.100.b:0 "절대 안 돼!"
 mem_voggo.110.name:0 "위대한 성공"
 mem_voggo.110.desc:0 "보고는 축제 같은 어조로 정부 관료들과 존경하는 [root.owner.GetRulerTitle]을(를) 비롯한 청중에게 연설합니다.\n\n§T\"기획 단계가 마무리되었으며 훌륭한 성공을 거두었소! 모든 계산이 검증되었고, 나의 이전 시도에서 나온 모든 결함이 바로잡혔으며, 모든 안전 절차는 내 작업을 검토할 자격이 있는 유일한 인물, 즉 나 자신이 작성하고 이중으로 확인했소. 설계는 기능적인 만큼이나 우아하오.\n\n이것이 하급 과학자들이 '경험에서 배운다'고 부르는 것일 텐데, 남은 것은 다소 평범한 장애물 하나뿐이오.\n\n기계가 아직 물리적 영역에 존재하지 않는다는 것이오. 안타깝게도 설계도는 스스로 조립될 능력이 없소. 합금을 주조하고, 회로를 설치하고, 복제 장치를 건설해야 하오. 다시 말해, 어려운 지적 작업은 끝났고 남은 것은 공학이오. 내가 감독하는 동안 그대의 백성들이 무거운 물건을 들어 올릴 능력이 충분하다고 나는 확신하오.\""
 mem_voggo.110.a:0 "훌륭하군."
 mem_voggo.110.b:0 "때가 됐군."
 mem_voggo.115.name:0 "[lord_voggo.GetName]"
 mem_voggo.115.desc_first_cloggo:0 "§H보고 대왕이 떠다니는 옥좌에 앉아 알현실에 들어섭니다. 연극적으로 팔을 벌리며 그는 진행 중이던 복제 절차가 완료되었음을 선언합니다.\n\n그에 따르면 결과는 완벽 그 자체이며, 그의 업적을 더럽히는 결함은 단 하나도 없습니다.\n\n그는 자신의 복제체를 불러들이고, 복제체는 비슷하지만 조금 덜 화려한 옷차림으로, 조금 덜 화려한 옥좌를 타고 떠다니며 들어옵니다. 보고는 다른 누군가가 자신의 이름을 쓴다고 해서 자신의 유일무이함이 줄어들지 않을 것이라고 설명하며 소개를 이어갑니다. 그래서 그는 복제체를 '클론-보고'의 줄임말을 따 클로고라고 소개합니다. 그 상상력 없는 작명에 감히 토를 다는 이는 없습니다. 그를 화나게 해 한 시간짜리 장광설을 불러올까 두렵기 때문입니다...\n\n침묵을 신호로 받아들인 클로고가 입을 엽니다.§!\n\n나는 중요한 직책을 맡아 나의 능력으로 제국을 빛낼 준비가 되어 있습니다."
 mem_voggo.115.desc_later_cloggo:0 "§H보고 대왕이 다시 한 번 진행 중인 복제 절차를 보고하러 알현실에 들어섭니다. 그의 최신 복제체는 그의 높은 기대를 충족한 듯하여, 그는 자화자찬에 불과한 끝없는 독백 중 하나를 시작합니다. 연설을 끊어 그를 화나게 하지 않도록, 새로 도착한 클로고는 자기 차례를 기다렸다가 마침내 우리에게 말을 겁니다.§!\n\n나는 중요한 직책을 맡아 나의 능력으로 제국을 빛낼 준비가 되어 있습니다."
 mem_voggo.115.desc_first_floggo:0 "§H보고 대왕이 떠다니는 옥좌에 앉아 알현실에 들어섭니다. 눈에 띄게 불만스러운 태도로 그는 진행 중이던 복제 절차가 완료되었다고 알립니다.\n\n그러나 그가 설명을 이어가듯 결과는 신통치 않았습니다. 완벽에 대한 그의 야망은 명백한 결함들로 더럽혀졌습니다.\n\n그는 자신의 복제체를 불러들이고, 복제체는 비슷하지만 눈에 띄게 덜 화려한 옷차림으로, 꽤 소박해 보이는 옥좌를 타고 떠다니며 들어옵니다. 앞서 말한 결함들은 무시한 채 보고는 우리에게 '실패한 클론-보고'의 합성어로 보이는 플로고라는 이 복제체가 어떤 직책이든 충분히 수행할 수 있다고 장담합니다. 보고의 미심쩍은 작명 감각은 넘기고 소개는 계속되며 플로고가 입을 엽니다.§!\n\n나의 가치를 증명할 준비가 되어 있습니다!"
 mem_voggo.115.desc_later_floggo:0 "§H보고 대왕이 다시 한 번 진행 중인 복제 절차를 보고하러 알현실에 들어섭니다. 그는 완벽을 향한 길에서 또 한 번의 좌절을 겪은 듯합니다. 그 뒤를 바짝 따라 또 다른 플로고가 알현실에 들어오는데, 비교적 초라한 옷차림과 옥좌 덕분에 확연히 구분됩니다. 평소의 태도와 달리 보고는 긴 독백을 할 기분이 아닌 듯하여, 새로 도착한 플로고가 첫인상을 남길 기회를 잡습니다.§!\n\n나의 가치를 증명할 준비가 되어 있습니다!"
 mem_voggo.115.c:0 "황금빛 피부라니, 정말입니까?"
 mem_voggo.115.c.response:0 "단순한 실수가 기회로 바뀐 것뿐이오. 내가 그대가 본 보르쿤 중 가장 눈부시게 아름답지 않소?"
 mem_voggo.115.d:0 "안색이 안 좋아 보이는군요"
 mem_voggo.115.d.response:0 "나를 두려워하는 것이오? 좋소. 그래야 마땅하오."
 mem_voggo.115.e:0 "그래서 피부색을 직접 골랐다는 겁니까?"
 mem_voggo.115.e.response:0 "변화의 빛이 없다면 우주는 정체되어 붕괴할 것이오. 오직 이 투쟁을 통해서만 어떤 발전이든 이루어질 수 있소."
 mem_voggo.115.f:0 "평화주의자입니까?"
 mem_voggo.115.f.response:0 "분노를 붙들고 있는 것은 다른 이에게 던지려고 뜨거운 석탄을 움켜쥐는 것과 같소. 데는 것은 결국 그대 자신이오."
 mem_voggo.200.name:0 "전략적 재편성"
 mem_voggo.200.desc:0 "몇 주간의 생산적인 논의 끝에 보고들은 만장일치로 현재 예산이 모욕적일 만큼 빈약하다고 판단했습니다. 평소 의회 구성원들 사이에서 길고 지루한 외교적 공방이 필요했던 것을 감안하면 이렇게 빨리 결론에 이른 것은 다소 놀라운 일이었습니다.\n\n그리하여 그들은 추가 자금을 요청하는 겸손한 청원을 제출했습니다. 요구가 아니라 지원을 받을 자격이 있는 '견줄 데 없는 행정 인재들의 확장하는 집단'이 보내는 정중한 호소로 일부러 표현했습니다."
 mem_voggo.200.a:0 "아주 좋군."
 mem_voggo.200.b:0 "좋지 않은 생각이야."
 mem_voggo.200.c:0 "거부한다."
 mem_voggo.205.name:0 "보고 평의회"
 mem_voggo.205.desc:0 "열네 시간이나 이어지고 모든 참석자가 스스로를 의장이라 선언하며 끝난 또 한 번의 긴 토론 끝에, 다음과 같은 결론이 도출되어 공식 성명으로 전달되었습니다.\n\n§T\"제국의 과학적 진보를 광범위하게 분석한 결과, 우리는 피할 수 없는 단 하나의 결론에 도달했소. 연구 자금은 부족한 정도가 아니라 한심할 지경이오.\n\n통계적으로 보고들로 가득한 방만큼, 하물며 그보다 더 지적인 존재는 거의 없소. 사실 공정한 비교조차 되지 못하오. 그대들도 결국 같은 결론에 이르렀으리라 확신하지만, 우리는 그대들이 몇 년간 겪을 고통스러운 사고 과정을 덜어 주었소.\"§!"
 mem_voggo.205.a:0 "감사합니다?"
 mem_voggo.210.name:0 "뜨거운 라이벌 관계"
 mem_voggo.210.desc:0 "좋은 소식이오. 모든 위대한 로맨스가 그렇듯 뜨거운 지적 논쟁에서 시작되었소. [mem_voggo_married_to.GetName]이(가) 나, [mem_voggo_married.GetName]이(가) 비교적 단순한 경제 전망을 오해했다고 비난했소. 나는 [mem_voggo_married_to.GetName]이(가) 장식용 화초 수준의 분석 능력을 지녔다고 응수했소. 사태는 거기서부터 격화되었소. 우리는 여섯 시간 동안 논쟁했소. 그러다 멈추고 서로의 눈을 깊이 들여다보다가 입을 맞추었소. 나머지는 모두 역사요."
 mem_voggo.210.a:0 "뭐라고?!"
