 mem_voggo_background:0 "보고 대왕은 한때 자신의 비할 데 없는 지혜와 선견지명으로 이끌던 강력한 은하 제국, 보르쿤 공화국의 통치자였습니다. 보르쿤 원로원이 믿으려 하지 않은 재앙을 예견한 그는 그들을 구하기 위해 절대 권력을 요구했으나 ... 이를 부당한 권력 찬탈로 오해한 그들은 그에게 추방 아니면 죽음을 제시했습니다."
