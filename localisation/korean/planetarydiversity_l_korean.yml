 job_pd_megaflora_rootbreaker:0 "뿌리 파쇄공"
 job_pd_megaflora_rootbreaker_plural:0 "뿌리 파쇄공"
 job_pd_megaflora_rootbreaker_desc:0 "뿌리 파쇄공은 거대식물의 거대한 뿌리를 따라 지각 깊숙이 들어가 일반 갱도로는 닿을 수 없는 광물을 캐내며, 광석과 함께 식용 뿌리 덩어리도 끌어올립니다."
 job_pd_megaflora_rootbreaker_drone:0 "뿌리 파쇄공"
 job_pd_megaflora_rootbreaker_drone_plural:0 "뿌리 파쇄공"
 job_pd_megaflora_rootbreaker_drone_desc:0 "$job_pd_megaflora_rootbreaker_desc$"
 mod_job_pd_megaflora_rootbreaker_add:0 "[pd_megaflora_rootbreaker.GetName] 직업"
 mod_job_pd_megaflora_rootbreaker_drone_add:0 "[pd_megaflora_rootbreaker_drone.GetName] 직업"
 job_pd_megaflora_canopy_ecologist:0 "수관 생태학자"
 job_pd_megaflora_canopy_ecologist_plural:0 "수관 생태학자"
 job_pd_megaflora_canopy_ecologist_desc:0 "수관 생태학자는 하늘을 찌를 듯한 거대식물과 그 아래 층층이 깃든 생명을 연구하여 사회 연구를 발전시키며, 꾸준히 공학적 통찰을 얻습니다."
 job_pd_megaflora_canopy_ecologist_drone:0 "수관 생태학자"
 job_pd_megaflora_canopy_ecologist_drone_plural:0 "수관 생태학자"
 job_pd_megaflora_canopy_ecologist_drone_desc:0 "$job_pd_megaflora_canopy_ecologist_desc$"
 mod_job_pd_megaflora_canopy_ecologist_add:0 "[pd_megaflora_canopy_ecologist.GetName] 직업"
 mod_job_pd_megaflora_canopy_ecologist_drone_add:0 "[pd_megaflora_canopy_ecologist_drone.GetName] 직업"
 job_pd_megaflora_xylem_tapper:0 "물관부 채취공"
 job_pd_megaflora_xylem_tapper_plural:0 "물관부 채취공"
 job_pd_megaflora_xylem_tapper_desc:0 "물관부 채취공은 거대식물의 방대한 수액 압력망에서 전력을 얻으며, 이 자가 연료 체계는 식용 바이오매스도 함께 생산합니다."
 job_pd_megaflora_xylem_tapper_drone:0 "물관부 채취공"
 job_pd_megaflora_xylem_tapper_drone_plural:0 "물관부 채취공"
 job_pd_megaflora_xylem_tapper_drone_desc:0 "$job_pd_megaflora_xylem_tapper_desc$"
 mod_job_pd_megaflora_xylem_tapper_add:0 "[pd_megaflora_xylem_tapper.GetName] 직업"
 mod_job_pd_megaflora_xylem_tapper_drone_add:0 "[pd_megaflora_xylem_tapper_drone.GetName] 직업"
 job_pd_petrified_fossil_quarrier:0 "화석 채석공"
 job_pd_petrified_fossil_quarrier_plural:0 "화석 채석공"
 job_pd_petrified_fossil_quarrier_desc:0 "화석 채석공은 석화된 지층에서 광물을 캐내며, 발굴한 표본은 약간의 사회 연구에 쓰입니다."
 job_pd_petrified_fossil_quarrier_drone:0 "화석 채석공"
 job_pd_petrified_fossil_quarrier_drone_plural:0 "화석 채석공"
 job_pd_petrified_fossil_quarrier_drone_desc:0 "$job_pd_petrified_fossil_quarrier_desc$"
 mod_job_pd_petrified_fossil_quarrier_add:0 "[pd_petrified_fossil_quarrier.GetName] 직업"
 mod_job_pd_petrified_fossil_quarrier_drone_add:0 "[pd_petrified_fossil_quarrier_drone.GetName] 직업"
 job_pd_petrified_amber_artisan:0 "호박 직공"
 job_pd_petrified_amber_artisan_plural:0 "호박 직공"
 job_pd_petrified_amber_artisan_desc:0 "호박 직공은 행성의 화석 수지를 귀중한 소비재로 가공하며, 그 아름다움은 식민지 전역의 편의를 높여 줍니다."
 job_pd_petrified_amber_artisan_drone:0 "호박 직공"
 job_pd_petrified_amber_artisan_drone_plural:0 "호박 직공"
 job_pd_petrified_amber_artisan_drone_desc:0 "$job_pd_petrified_amber_artisan_desc$"
 mod_job_pd_petrified_amber_artisan_add:0 "[pd_petrified_amber_artisan.GetName] 직업"
 mod_job_pd_petrified_amber_artisan_drone_add:0 "[pd_petrified_amber_artisan_drone.GetName] 직업"
 job_pd_petrified_lithoglyph_scholar:0 "암각 학자"
 job_pd_petrified_lithoglyph_scholar_plural:0 "암각 학자"
 job_pd_petrified_lithoglyph_scholar_desc:0 "암각 학자는 돌에 새겨진 행성의 격동의 역사를 읽어 공학 연구를 생산하며, 사회적 통찰도 조금씩 얻습니다."
 job_pd_petrified_lithoglyph_scholar_drone:0 "암각 학자"
 job_pd_petrified_lithoglyph_scholar_drone_plural:0 "암각 학자"
 job_pd_petrified_lithoglyph_scholar_drone_desc:0 "$job_pd_petrified_lithoglyph_scholar_desc$"
