 mem_food_constructor_large_ship_plural:0 "관문 수호자들"
 mem_food_constructor_small_ship:0 "감시자"
 mem_food_constructor_small_ship_plural:0 "감시대"
 mem_food_constructor_decommision_force_site:0 "파괴되어 버려진 곳"
 mem_food_constructor_decommision_force_site_desc:0 "[From.GetName]은(는) 한때 상당한 인구를 품고 있었으나, 일종의 재난 이후 버려진 것으로 보입니다. 폐허가 된 도시와 노천 광산, 산업 지대가 여전히 달 표면 곳곳에 남아 있습니다."
 NAME_Jensen:0 "젠슨"
 mem_food_constructor.100.name:0 "교신 수신"
 mem_food_constructor.100.desc:0 "경고! 리산 소비자 로보틱스가 여행 주의보를 발령합니다. 이 성계는 현재 허가받지 않은 자각형 합성체의 창궐로 인해 모든 함선 통행이 금지되어 있습니다. 성계를 직접 통과하기 위한 허가를 요청하시려면 리산 소비자 로보틱스 고객 지원에 문의하십시오. 공지: 리산 소비자 로보틱스 고객 지원은 현재 DATA NOT AVAILABLE 이후로 운영이 중단된 상태입니다. 이는 DATA NOT AVAILABLE에 해결될 예정입니다"
 mem_food_constructor.100.a:0 "REPLACE_ME"
 mem_food_constructor.100.b:0 "REPLACE_ME"
 mem_food_constructor.100.c:0 "REPLACE_ME"
 mem_food_constructor.105.name:0 "기계주의자 식민지"
 mem_food_constructor.105.desc:0 "달 표면에 대한 예비 조사 결과, 이곳은 일종의 자급자족형 산업·연구 세계로 정착된 것으로 보입니다. 비교적 소규모의 유기체 정착민 집단이 로봇 노동자를 구입해 인구를 크게 불렸고, 로봇이 유기체 주인의 수 배에 달했던 것으로 보입니다.\n지금까지 탐사한 모든 정착지에서 정착민과 로봇의 잔해가 발견됩니다. 우리가 아는 한 그들의 몰락은 대부분 갑작스럽고 대체로 평화로웠지만, 식민지가 마련해 둔 로봇 수용 시설로 짐작한 규모에 비하면 로봇의 잔해는 극히 일부에 불과합니다. 일부 로봇 잔해에서는 \"리산 소비자 로보틱스\" 로고를 식별할 수 있습니다."
 mem_food_constructor.105.a:0 "REPLACE_ME"
 mem_food_constructor.110.name:0 "사인"
 mem_food_constructor.110.desc:0 "갑작스러운 식민지 붕괴의 원인을 밝혀냈습니다. 무책임한 채굴 관행이 달을 불안정하게 만들어 유기체 생명체가 살 수 없을 정도의 대규모 참사를 일으킨 것으로 보입니다. 이후 달은 안정을 되찾았으며, 이런 사고를 가능하게 한 나쁜 관행과 불운, 그리고 그보다 더 나쁜 판단이 다른 곳에서 되풀이될 가능성은 낮습니다."
 mem_food_constructor.110.a:0 "REPLACE_ME"
 mem_food_constructor.115.name:0 "남겨진 자들"
 mem_food_constructor.115.desc:0 "사라진 로봇 인구를 찾았습니다. 정확히는 그들의 잔해입니다. 우리의 최초 추정은 완전히 옳지는 않았던 것 같습니다. 유기체 정착민은 사고로 전멸했지만, 로봇 노동력은 대부분 주인보다 오래 살아남았습니다.\n초기의 혼란이 가라앉은 뒤 생존한 로봇들은 원래 주인들의 사회를 흉내 낸 사회를 재건하며 행성을 되찾으려 했습니다. 그러나 그들의 통제는 오래가지 못한 듯합니다. 일종의 침략군에게 폭력적으로 공격당했고, 파괴된 잔해는 이제 행성의 외진 곳에 쌓여 있습니다. 평화로운 노동 로봇 집단은 침략자들의 상대가 되지 못했음이 분명합니다."
 mem_food_constructor.115.a:0 "REPLACE_ME"
 mem_food_constructor.120.name:0 "대피소"
 mem_food_constructor.120.desc:0 "달을 더 탐사하던 중, 로봇들이 자신들을 죽이던 누군가 혹은 무언가로부터 숨기 위해 사용한 벙커를 발견했습니다. 이 벙커는 뚫린 것으로 보이며, 내부의 거주자들은 폭력적으로 분해되었고 컴퓨터 시스템은 지워지고 파괴되었습니다. 그러나 표면 다른 곳에 숨겨진 벙커가 더 있을 수 있다고 믿을 이유가 있지만, 현재로서는 그 위치를 찾을 방법을 알지 못합니다."
 mem_food_constructor.120.a:0 "REPLACE_ME"
 mem_food_constructor.124.name:0 "이상한 교신"
 mem_food_constructor.124.desc:0 "여보세요? 네, 거기 이상한 우주 사람들. 우리의 한때 위대했던(글쎄요, 아마 눈치채셨겠지만 그렇게 위대하진 않았죠) 문명의 폐허를 파헤치는 걸 봤는데, 혹시 해체반은 마침내 떠났나요? 이제 밖에 나가도 안전한가요? 혹시 만나서, 이 폐기장에서 녹슬어 가는 대신 제가 떠났어야 했던 거창한 우주 모험으로 저를 데려가 주시지 않겠어요? 가능성 있나요?\n아, 잠깐, 이 물건에 수신기를 달아 두는 걸 깜빡했네요. 그러니 당신 목소리가 안 들리겠군요. 어디 가지 마세요, 금방 돌아올게요."
 mem_food_constructor.124.a:0 "REPLACE_ME"
 mem_food_constructor.124.b:0 "REPLACE_ME"
 mem_food_constructor_leader_catchphrase:0 "REPLACE_ME"
 mem_food_constructor_leader_backstory:0 "REPLACE_ME"
 mem_food_constructor.125.name:0 "공지"
 mem_food_constructor.125.desc:0 "허가 없이 무단 점거 중인 미확인 개체들에게 알립니다. 이곳은 리산 소비자 로보틱스가 파견한 자동 해체 특수임무부대입니다.\n본 부대는 [From.GetName]에 창궐한 허가받지 않은 자각형 독점 합성 생명체를 모두 제거하기 위해 배치되었습니다. 해체 과정을 방해하지 마십시오.\n리산 공식 무단 점유 정책에 따르면 무단 점유권은 존재하지 않습니다. 해체 방해를 막기 위한 치명적 무력 사용이 승인되어 있습니다.\n후속 방문 시 리산 소비자 로보틱스 법무팀이 추가 청구, 말소 및/또는 합의 협상을 진행합니다. 절차를 앞당기고자 하신다면 NO CONTACT METHOD AVAILABLE을 통해 리산 소비자 로보틱스 법무팀에 직접 연락하셔도 됩니다.\n협조에 감사드립니다. 협조하실 의사가 없다면 이 감사 인사는 무시하시고, 대신 기도를 올리거나 잘못된 삶의 선택을 돌아보시기 바랍니다."
 mem_food_constructor.125.b:0 ""
 mem_food_constructor.125.c:0 "REPLACE_ME"
 mem_food_constructor.125.c.response:0 "REPLACE_ME"
 mem_food_constructor.135.name:0 "REPLACE_ME"
 mem_food_constructor.135.desc_stopped:0 "리산 소비자 로보틱스는 귀하의 협조와 해체 작업을 방해하지 않아 주신 데 감사드립니다. 올바른 선택을 하셨습니다.\n연결이 재확립되면 리산 소비자 로보틱스 법무팀이 리산 제휴 성계에 귀하가 머문 데 따른 결과를 논의하기 위해 연락드릴 것입니다. 행운을 빌며 안녕히 계십시오, 및/또는 귀하의 신들이 귀하의 영혼에 자비를 베풀기를."
 mem_food_constructor.135.desc_ruined:0 "리산 소비자 로보틱스 해체 특수임무부대가 [From.GetName]에서 해체 작업을 마쳤습니다. 귀하의 잘못된 결정 및/또는 리산 제휴 성계 무단 점거로 인해 귀하의 재산에 발생한 손해에 유감을 표합니다.\n리산 소비자 로보틱스 법무팀이 무단 점거, 허가받지 않은 합성체 동조, 기물 파손 등 소비자 로보틱스에 대한 귀하의 위반 행위를 만회할 방법에 대한 추가 정보를 안내해 드릴 것입니다.\n행운을 빕니다."
