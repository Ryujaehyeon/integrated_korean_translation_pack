 decision_mem_food_constructor_shut_down_desc:0 "과잉 생산 식량 제조기 1개와 리산 열쇠 1개는 비활성 식량 제조기 1개와 같습니다."
 mem_food_constructor_shut_down_effect:0 "식량 제조기가 비활성화됩니다. 그것이 제공하는 모든 £job_mem_dust_gatherer£ 직업과 함께 그 효과 대부분은 행성에서 영원히 제거될 것입니다."
 mem_food_constructor_debuff_0:0 "세월의 황폐함"
 mem_reesan_habitat_ruined:0 "폐허가 된 리산 거주지"
 mem_reesan_habitat_ruined_DESC:0 "이 구조물은 한때 리산 활동의 중심지였으며 많은 이들의 집이었습니다. 거대한 맞물린 링은 오래전에 부서졌고, 중심부의 전원 공급원은 꺼졌지만, 복구할 수 있습니다."
 mem_reesan_habitat_ruined_MEGASTRUCTURE_DETAILS:0 ""
 mem_reesan_habitat_ruined_CONSTRUCTION_INFO_DELAYED:0 ""
 mem_reesan_habitat_restored:0 "복원된 리사 거주지"
 mem_reesan_habitat_restored_DESC:0 "거주지가 재건되었고 그 중심에 있는 동력 핵이 다시 불타올라 구조물을 작동시켰습니다."
 mem_reesan_habitat_restored_MEGASTRUCTURE_DETAILS:0 "$habitat_0_MEGASTRUCTURE_DETAILS$"
