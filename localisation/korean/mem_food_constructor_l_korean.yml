 d_mem_reesan_ring:0 "특허받은 리산 거대구조물"
 d_mem_reesan_ring_desc:0 "스테이션을 둘러싸고 있는 거주 가능한 띠모양의 건축물로 건설에 최적화되어 있습니다. 역장 발생기는 추가적인 안정성을 보장합니다."
 d_mem_reesan_core:0 "리산 핵"
 d_mem_reesan_core_desc:0 "격리 구역 내부에서 붙잡힌 미세 특이점은 스테이션에 효과적이고 얻기 쉬운 동력원을 제공합니다."
 mem_requires_voidborn_ap:0 "§R§Y$ap_voidborn$§R 특전 또는 §Y$tech_mega_engineering$§R 기술 필요§!"
 mem_requires_starbase_4_tech:0 "§R§Y$ap_voidborn$§R 특성, §Y$tech_starbase_4$§R 기술 또는 §Y$tech_mega_engineering$§R 기술 중 하나가 필요합니다.§!"
